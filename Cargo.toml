[package]
name = "gomoku"
version = "0.1.0"
edition = "2021"

[features]
default = ["gstreamer-support"]
gstreamer-support = ["bevy_gstreamer", "gstreamer", "gstreamer-app", "gstreamer-video"]

[dependencies]
bevy = { version = "0.16.1", features = ["bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_audio", "png", "jpeg", "mp3", "wav"] }
bevy_gstreamer = { version = "0.7", optional = true }
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }
image = "0.25"
rand = "0.9.2"
rand_chacha = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
futures-lite = "2.5"

# Optimized dev profile: Fast compilation for your code, optimized dependencies
[profile.dev]
# Keep your code unoptimized for fast compilation
opt-level = 0
debug = true
# But optimize all dependencies for better runtime performance
[profile.dev.package."*"]
opt-level = 3
debug = false

# Fast release profile for development (quick compilation, good performance)
[profile.release-dev]
inherits = "release"
opt-level = 2           # Good optimization, but faster than 3
debug = false
lto = false             # No LTO for fast builds
codegen-units = 16      # Parallel compilation
panic = "abort"

# Full release profile (maximum optimization, slow compilation)
[profile.release]
opt-level = 3
debug = false
lto = true              # Full LTO for maximum optimization
codegen-units = 1       # Single codegen unit for best optimization
panic = "abort"
