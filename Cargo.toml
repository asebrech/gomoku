[package]
name = "gomoku"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16.1", features = ["bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_audio", "png", "jpeg", "mp3", "wav"] }
bevy_gstreamer = "0.7"
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
image = "0.25"
rand = "0.9.2"
rand_chacha = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
futures-lite = "2.5"
