[package]
name = "gomoku"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "wasm-bindgen-futures", "js-sys", "getrandom", "getrandom/js"]

[dependencies]
# Core dependencies - always available
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional dependencies
getrandom = { version = "0.2", optional = true }

# WASM-specific dependencies
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

# Conditional dependencies
rayon = { version = "1.8", optional = true }
futures-lite = { version = "2.5", optional = true }

[[bin]]
name = "gomoku"
path = "src/main.rs"

# Optimized dev profile: Fast compilation for your code, optimized dependencies
[profile.dev]
# Keep your code unoptimized for fast compilation
opt-level = 0
debug = true
# But optimize all dependencies for better runtime performance
[profile.dev.package."*"]
opt-level = 3
debug = false

# Fast release profile for development (quick compilation, good performance)
[profile.release-dev]
inherits = "release"
opt-level = 2           # Good optimization, but faster than 3
debug = false
lto = false             # No LTO for fast builds
codegen-units = 16      # Parallel compilation
panic = "abort"

# Full release profile (maximum optimization, slow compilation)
[profile.release]
opt-level = 3
debug = false
lto = true              # Full LTO for maximum optimization
codegen-units = 1       # Single codegen unit for best optimization
panic = "abort"
